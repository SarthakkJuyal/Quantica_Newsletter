<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantica - Join Us</title>
  <style>
    /* Upgraded Full-Webpage Background */
    body {
      margin: 0;
      padding: 0;
      background-color: #05010a;
      /* Combines a glowing quantum nebula effect with a synthwave grid */
      background-image: 
        radial-gradient(circle at 50% -20%, rgba(123, 44, 191, 0.4), transparent 60%),
        radial-gradient(circle at 120% 100%, rgba(209, 0, 116, 0.3), transparent 50%),
        radial-gradient(circle at -20% 100%, rgba(42, 10, 102, 0.6), transparent 50%),
        linear-gradient(rgba(138, 43, 226, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(138, 43, 226, 0.15) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      padding: 50px 20px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      background-color: #0b0219;
      border-radius: 16px;
      overflow: hidden;
      /* Adds a strong neon glow around the central email container */
      box-shadow: 0 0 45px rgba(123, 44, 191, 0.4), 0 0 20px rgba(255, 42, 117, 0.2);
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      border: none;
    }

    /* CTA Section */
    .cta-container {
      text-align: center;
      padding: 45px 20px;
      background: linear-gradient(180deg, #160533 0%, #0b0219 100%);
      position: relative;
    }

    .cta-button {
      display: inline-block;
      background: linear-gradient(135deg, #d10074 0%, #7b2cbf 100%);
      color: #ffffff !important;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 48px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(209, 0, 116, 0.6);
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 35px rgba(209, 0, 116, 0.9), 0 0 15px rgba(123, 44, 191, 0.8);
      background: linear-gradient(135deg, #f72585 0%, #9d4edd 100%);
    }

    /* Footer Section */
    .footer {
      background: linear-gradient(180deg, #070110 0%, #030008 100%);
      border-top: 2px solid #d10074;
      padding: 35px 20px 25px;
      text-align: center;
    }

    .footer-title {
      font-size: 16px;
      font-weight: 700;
      color: #e0aaff;
      margin: 0 0 20px 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Updated Social Links for PNGs */
    .social-links {
      margin-bottom: 25px;
      display: flex;
      justify-content: center;
      gap: 24px;
      align-items: center;
    }

    .social-link {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .social-link img {
      width: 36px;
      height: 36px;
      display: block;
      transition: filter 0.3s ease;
    }

    .social-link:hover {
      transform: translateY(-4px) scale(1.05);
    }

    .social-link:hover img {
      /* Adds a pink glow behind the PNGs on hover */
      filter: drop-shadow(0 0 12px rgba(209, 0, 116, 0.8));
    }

    .copyright {
      font-size: 12px;
      color: #5a427a;
      margin: 0;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="container">
      
      <img 
        src="https://quantica-newsletter.vercel.app/Sept_2026/Recruitment/quantica.png" 
        alt="Quantica - The Quantum Computing Club" 
        class="poster-img"
      />

      <div class="cta-container">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSc3XuKMGKzHHDCuvq7Submz8VtiarBZUhycrosvpfXyvZgz4Q/viewform?usp=sharing&ouid=117816515308185815474" target="_blank" class="cta-button">Register Here</a>
      </div>

      <footer class="footer">
        <p class="footer-title">Quantica</p>
        
        <div class="social-links">
          <a href="https://www.instagram.com/quantica_iiitd?igsh=ZTRtdDNrZHduem8x" target="_blank" class="social-link" aria-label="Instagram">
            <img src="https://quantica-newsletter.vercel.app/Assets/Instagram.png" alt="Instagram Logo">
          </a>
          <a href="https://www.linkedin.com/company/quantica-hq/" target="_blank" class="social-link" aria-label="LinkedIn">
            <img src="https://quantica-newsletter.vercel.app/Assets/LinkedIn.png" alt="LinkedIn Logo">
          </a>
        </div>
        
        <p class="copyright">&copy; 2026 Quantica, IIIT-Delhi.</p>
      </footer>

    </div>
  </div>

</body>
</html>
